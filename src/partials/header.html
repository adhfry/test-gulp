@@include('components/icons.html')

<a href="#main" class="skip-link">Langsung ke konten utama</a>

<header class="header" data-header>
  <nav class="navbar container" aria-label="Navigasi utama">
    <a href="/" class="navbar-brand" aria-label="DS Studio – kembali ke beranda">
      <img
        src="/images/ds-logo.png"
        width="584"
        height="225"
        alt="Logo DS Studio Photography"
        class="h-10 w-auto sm:h-11"
      />
    </a>

    <ul class="navbar-nav hidden lg:flex" role="list">
      <li><a href="/#layanan" class="nav-link" data-nav-link>Layanan</a></li>
      <li><a href="/#portofolio" class="nav-link" data-nav-link>Portofolio</a></li>
      <li><a href="/#tentang" class="nav-link" data-nav-link>Tentang</a></li>
      <li><a href="/#cara-booking" class="nav-link" data-nav-link>Cara Booking</a></li>
      <li><a href="/#faq" class="nav-link" data-nav-link>FAQ</a></li>
      <li><a href="/#kontak" class="nav-link" data-nav-link>Lokasi</a></li>
    </ul>

    <div class="flex items-center gap-2">
      <a
        href="<%= instagramUrl %>"
        class="icon-btn hidden sm:inline-flex"
        target="_blank"
        rel="noopener"
        aria-label="Instagram DS Studio @<%= site.instagram %> (tab baru)"
      >
        <svg class="icon h-5 w-5" aria-hidden="true"><use href="#i-instagram" /></svg>
      </a>
      <a
        href="<%= wa('Halo DS Studio, saya ingin booking / tanya jadwal foto.') %>"
        class="btn btn-whatsapp btn-sm hidden md:inline-flex"
        target="_blank"
        rel="noopener"
        data-wa-cta="header"
      >
        <svg class="icon-fill h-[18px] w-[18px]" aria-hidden="true"><use href="#i-whatsapp" /></svg>
        Booking via WhatsApp
      </a>
      <button
        type="button"
        class="icon-btn lg:hidden"
        aria-expanded="false"
        aria-controls="mobile-menu"
        aria-label="Buka menu"
        data-menu-toggle
      >
        <svg class="icon h-6 w-6" aria-hidden="true" data-menu-icon-open><use href="#i-menu" /></svg>
        <svg class="icon hidden h-6 w-6" aria-hidden="true" data-menu-icon-close><use href="#i-x" /></svg>
      </button>
    </div>
  </nav>

  <!-- mobile menu -->
  <div id="mobile-menu" class="mobile-menu lg:hidden" hidden data-mobile-menu>
    <ul class="container py-4" role="list">
      <li><a href="/#layanan" class="mobile-link" data-nav-link>Layanan</a></li>
      <li><a href="/#portofolio" class="mobile-link" data-nav-link>Portofolio</a></li>
      <li><a href="/#tentang" class="mobile-link" data-nav-link>Tentang Kami</a></li>
      <li><a href="/#cara-booking" class="mobile-link" data-nav-link>Cara Booking</a></li>
      <li><a href="/#faq" class="mobile-link" data-nav-link>FAQ</a></li>
      <li><a href="/#kontak" class="mobile-link" data-nav-link>Lokasi &amp; Kontak</a></li>
      <li class="mt-4 grid gap-3 sm:grid-cols-2">
        <a
          href="<%= wa('Halo DS Studio, saya ingin booking / tanya jadwal foto.') %>"
          class="btn btn-whatsapp w-full"
          target="_blank"
          rel="noopener"
          data-wa-cta="mobile-menu"
        >
          <svg class="icon-fill h-5 w-5" aria-hidden="true"><use href="#i-whatsapp" /></svg>
          Chat WhatsApp
        </a>
        <a
          href="<%= instagramUrl %>"
          class="btn btn-outline w-full"
          target="_blank"
          rel="noopener"
        >
          <svg class="icon h-5 w-5" aria-hidden="true"><use href="#i-instagram" /></svg>
          @<%= site.instagram %>
        </a>
      </li>
    </ul>
  </div>
</header>
