<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <script>
    document.documentElement.classList.add("js");
  </script>

  <!-- primary meta -->
  <title><%= page.title %></title>
  <meta name="description" content="<%= page.description %>" />
  <meta
    name="keywords"
    content="studio foto sumenep, fotografer sumenep, foto wedding sumenep, prewedding sumenep, foto wisuda sumenep, foto maternity sumenep, fotografer madura, dokumentasi acara sumenep, videografer sumenep, DS Studio"
  />
  <meta name="author" content="<%= site.name %>" />
  <meta name="robots" content="<%= page.robots %>" />
  <link rel="canonical" href="<%= site.url %><%= page.path %>" />
  <link rel="alternate" hreflang="id-ID" href="<%= site.url %><%= page.path %>" />
  <meta name="format-detection" content="telephone=no" />

  <!-- local seo -->
  <meta name="geo.region" content="ID-JI" />
  <meta name="geo.placename" content="Sumenep, Jawa Timur" />
  <meta name="geo.position" content="<%= site.geo.lat %>;<%= site.geo.lng %>" />
  <meta name="ICBM" content="<%= site.geo.lat %>, <%= site.geo.lng %>" />

  <!-- open graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:site_name" content="<%= site.legal_name %>" />
  <meta property="og:title" content="<%= page.title %>" />
  <meta property="og:description" content="<%= page.description %>" />
  <meta property="og:url" content="<%= site.url %><%= page.path %>" />
  <meta property="og:image" content="<%= site.url %>/images/og-image.jpg" />
  <meta
    property="og:image:secure_url"
    content="<%= site.url %>/images/og-image.jpg"
  />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta
    property="og:image:alt"
    content="Hasil foto DS Studio Sumenep: pengantin adat, prewedding, dan pengantin berkebaya"
  />

  <!-- twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="<%= page.title %>" />
  <meta name="twitter:description" content="<%= page.description %>" />
  <meta name="twitter:image" content="<%= site.url %>/images/og-image.jpg" />
  <meta
    name="twitter:image:alt"
    content="Hasil foto DS Studio Sumenep: pengantin adat, prewedding, dan pengantin berkebaya"
  />

  <!-- theme & icons -->
  <meta name="theme-color" content="#faf8f5" />
  <meta name="application-name" content="<%= site.name %>" />
  <meta name="apple-mobile-web-app-title" content="<%= site.name %>" />
  <meta name="msapplication-TileColor" content="#1c1917" />
  <meta
    name="msapplication-TileImage"
    content="/images/favicon/ms-icon-144x144.png"
  />
  <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/images/favicon/favicon-32x32.png"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/images/favicon/android-icon-192x192.png"
  />
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="/images/favicon/apple-icon-180x180.png"
  />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="image"
    type="image/webp"
    href="/images/portfolio/wedding-pelaminan-adat-640.webp"
    imagesrcset="/images/portfolio/wedding-pelaminan-adat-640.webp 640w, /images/portfolio/wedding-pelaminan-adat-1280.webp 1280w"
    imagesizes="(min-width: 1024px) 440px, 78vw"
    fetchpriority="high"
  />

  <!-- fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=<%= fontPrimary %>&family=<%= fontSecondary %>&display=swap"
    rel="stylesheet"
  />

  <!-- Main Stylesheet -->
  <link href="/styles/main.css" rel="stylesheet" />

  <!-- structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfessionalService",
          "@id": "<%= site.url %>/#business",
          "name": "<%= site.legal_name %>",
          "alternateName": ["<%= site.name %>", "Ds.Studio", "DS Photography"],
          "description": "Studio foto dan jasa fotografer di Sumenep, Madura untuk wedding, prewedding, wisuda, maternity, portrait, foto studio, event, video dokumentasi, dan undangan digital.",
          "url": "<%= site.url %>/",
          "logo": "<%= site.url %>/images/ds-logo-1x1.png",
          "image": [
            "<%= site.url %>/images/og-image.jpg",
            "<%= site.url %>/images/portfolio/wedding-pelaminan-adat-1280.webp",
            "<%= site.url %>/images/portfolio/prewedding-adat-outdoor-1280.webp"
          ],
          "telephone": "<%= site.whatsapp_display %>",
          "email": "<%= site.email %>",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "<%= site.address.street %>",
            "addressLocality": "<%= site.address.locality %>",
            "addressRegion": "<%= site.address.region %>",
            "postalCode": "<%= site.address.postal_code %>",
            "addressCountry": "<%= site.address.country %>"
          },
          "geo": {
            "@type": "GeoCoordinates",
            "latitude": <%= site.geo.lat %>,
            "longitude": <%= site.geo.lng %>
          },
          "hasMap": "<%= site.maps_url %>",
          "areaServed": [
            { "@type": "City", "name": "Sumenep" },
            { "@type": "Place", "name": "Pulau Madura" },
            { "@type": "State", "name": "Jawa Timur" }
          ],
          "sameAs": ["https://www.instagram.com/<%= site.instagram %>/"],
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "<%= site.whatsapp_display %>",
            "contactType": "customer service",
            "availableLanguage": ["Indonesian"],
            "url": "https://wa.me/<%= site.whatsapp %>"
          },
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Layanan Fotografi DS Studio",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Fotografi Wedding & Akad Nikah" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foto Prewedding" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foto Wisuda" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foto Maternity & Tujuh Bulanan" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foto Portrait & Personal Branding" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Foto Studio Couple & Keluarga" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Dokumentasi Event & Instansi" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Video Dokumentasi" } },
              { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Undangan Digital" } }
            ]
          }
        },
        {
          "@type": "WebSite",
          "@id": "<%= site.url %>/#website",
          "url": "<%= site.url %>/",
          "name": "<%= site.legal_name %>",
          "inLanguage": "id-ID",
          "publisher": { "@id": "<%= site.url %>/#business" }
        }
      ]
    }
  </script>
</head>
